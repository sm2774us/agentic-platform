[project]
name = "agentic-platform"
version = "0.1.0"
description = "Production-grade multi-agent orchestration platform: LangGraph-style agents, RAG, evaluation, and LLMOps observability."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "tenacity>=9.0",
  "structlog>=24.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4.0",
]
mlflow = ["mlflow>=2.17"]
langgraph = ["langgraph>=0.2.45", "langchain-core>=0.3.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=agentic_platform --cov-report=term-missing --cov-report=xml --cov-fail-under=100 -q"
testpaths = ["tests"]
markers = ["e2e: end-to-end tests", "integration: integration tests"]

[tool.coverage.run]
branch = true
source = ["src/agentic_platform"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
