repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project virtualenv)
        # Deliberately NOT the mirrors-mypy repo hook: that hook creates its own
        # isolated virtualenv containing only `additional_dependencies`, which
        # never sees fastapi/structlog/tenacity/etc. installed in the project's
        # own .venv -- causing spurious "Cannot find implementation or library
        # stub" errors locally even though `mypy src` (what CI runs) is clean.
        # `language: system` calls whatever `mypy` is already on PATH -- i.e.
        # the activated project .venv's mypy -- matching CI exactly.
        entry: mypy
        language: system
        types_or: [python, pyi]
        args: ["src"]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest (100% coverage gate)
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
